name: Build bundle

on:
  # No push trigger: GitHub reads push workflows from the pushed branch.
  # This file exists only on main, not on backend/frontend/cli.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: build-bundle
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure Git identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Build and publish bundle
        id: build
        run: |
          before="$(git rev-parse HEAD:bundle)"
          node scripts/build-bundle.mjs --push
          after="$(git rev-parse HEAD:bundle)"
          if [ "$before" != "$after" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN pushes do not trigger push workflows; dispatch explicitly.
      - name: Build image for the new bundle
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker.yml --ref main --repo "$GITHUB_REPOSITORY"
